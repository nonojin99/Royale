<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" href="data:," />
  <title>로얄 (Royale)</title>
  <style>
    @font-face {
      font-family: 'Galmuri11';
      src: url('/fonts/Galmuri11.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Galmuri11';
      src: url('/fonts/Galmuri11-Bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: 'Galmuri9';
      src: url('/fonts/Galmuri9.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    :root {
      --font-pixel: 'Galmuri11', 'Galmuri9', system-ui, sans-serif;
      /* 모서리 깎인 콘솔 패널 — 둥근 사각의 'AI 기본값'을 벗어나는 형태 언어 */
      --cut: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px),
        calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
      --cut-sm: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px),
        calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px);
      --bg: #0b1220;
      --panel: #131c2e;
      --line: #24314b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --mineral: #22d3ee;
      --tech: #a78bfa;
      --base: #facc15;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      overflow: hidden;
    }

    /*
     * 넓은 화면(PC)에서는 조작부를 오른쪽으로 뺀다.
     *
     * 세로 스택으로 두면 아레나 높이가 조작부에 눌려서, 1080p 화면에서도
     * 유닛이 폰에서보다 작게 보인다. 가로는 남아도는데 세로가 모자란
     * 상황이라 사이드바가 정답이다.
     */
    :root { --sidebar-w: 0px; }
    @media (min-width: 900px) {
      /*
       * 생산 화면은 **늘 떠 있지 않는다** (라운드 50).
       *
       * 기지를 눌러야 열리고, 닫혀 있는 동안 사이드바는 자원·행동만 남긴
       * 폭으로 줄어든다. 맵이 48×48 정사각이라 넓은 창에서 전장은 가로에
       * 묶여 있어서, 사이드바 172px가 그대로 전장이 된다(1280×980에서 실측
       * 876 → 926px).
       *
       * 클래스는 `body`가 아니라 **`html`**에 붙는다 — `fitCanvas`가
       * `documentElement`에서 이 변수를 읽기 때문에, body에 걸면 값이 바뀌어도
       * 캔버스는 못 본다.
       */
      :root { --sidebar-w: 208px; }
      :root.panel-open { --sidebar-w: 380px; }
      body {
        display: grid;
        grid-template-columns: 1fr var(--sidebar-w);
        grid-template-rows: auto 1fr;
        grid-template-areas: "top top" "arena side";
        height: 100dvh;
        align-items: stretch;
      }
      #topbar { grid-area: top; max-width: none; }
      #arena { grid-area: arena; place-self: center; }
      #bottom {
        grid-area: side;
        max-width: none;
        overflow-y: auto;
        align-self: stretch;
        border-left: 1px solid #1e293b;
      }
    }

    /* 상단 바 */
    #topbar {
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      font-size: 13px;
    }
    #score { font-weight: 700; }
    #timer { font-variant-numeric: tabular-nums; font-weight: 700; }
    #btn-mute {
      background: none;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 14px;
      cursor: pointer;
      line-height: 1;
    }
    #btn-mute:hover { border-color: #334155; }
    kbd {
      font-family: var(--font-pixel);
      display: inline-block;
      min-width: 14px;
      padding: 1px 4px;
      border: 1px solid #334155;
      border-bottom-width: 2px;
      border-radius: 4px;
      font: 700 10px/1.3 inherit;
      color: var(--muted);
      background: #0f172a;
      vertical-align: 1px;
    }
    .ukey {
      position: absolute;
      top: 3px;
      right: 6px;
      font-size: 10px;
      font-weight: 700;
      color: #cbd5e1; /* muted(#94a3b8)는 패널 위에서 3:1 — 4.5:1을 넘기는 값 */
    }
    #over-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin-top: 6px;
    }
    #over-actions.hidden { display: none; }
    #btn-lobby {
      padding: 11px 20px;
      border: 1px solid var(--line);
      border-radius: 0;
      clip-path: var(--cut-sm);
      background: #10192c;
      color: var(--muted);
      font-family: var(--font-pixel);
      font-weight: 700;
      cursor: pointer;
    }
    #btn-lobby:hover { color: var(--text); border-color: #334155; }
    #btn-again {
      padding: 11px 28px;
      border: none;
      border-radius: 0;
      clip-path: var(--cut-sm);
      font-family: var(--font-pixel);
      font-weight: 700;
      font-size: 15px;
      color: #fff;
      background: linear-gradient(180deg, #38bdf8, #4453e6);
      box-shadow: inset 0 2px 0 rgba(255,255,255,.25), inset 0 -3px 0 rgba(0,0,0,.35);
      cursor: pointer;
    }
    #btn-replay {
      color: var(--muted);
      font-size: 13px;
      text-decoration: underline;
    }
    #hint {
      position: fixed;
      left: 50%;
      bottom: 66px;
      transform: translate(-50%, 8px);
      max-width: min(85vw, 480px);
      padding: 10px 16px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: rgba(10, 18, 32, .94);
      color: #e2e8f0;
      font-size: 13px;
      line-height: 1.5;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      z-index: 30;
    }
    #hint.show { opacity: 1; transform: translate(-50%, 0); }
    #opponent { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 아레나 */
    #arena {
      position: relative;
      line-height: 0;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,.5);
      touch-action: none;
    }
    #arena canvas { display: block; }

    /* 하단 패널 */
    #bottom { width: 100%; max-width: 520px; padding: 8px 12px 12px; }

    /* 미네랄 */
    #mineral-row { display: flex; align-items: center; gap: 8px; }
    #mineral-bar {
      position: relative;
      flex: 1;
      height: 16px;
      background: #1e293b;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--line);
    }
    #mineral-fill {
      height: 100%;
      width: 25%;
      background: linear-gradient(90deg, #0e7490, var(--mineral));
      transition: width 80ms linear;
    }
    #mineral-num {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      font-size: 11px; font-weight: 800;
      text-shadow: 0 1px 2px rgba(0,0,0,.8);
      font-variant-numeric: tabular-nums;
    }
    #income { font-size: 11px; color: var(--mineral); font-weight: 700; white-space: nowrap; }
    #workers { font-size: 11px; color: var(--base); font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
    #workers.full { color: #f87171; }

    /* 액션 행 */
    #actions { display: flex; gap: 6px; margin-top: 8px; }
    #actions button {
      flex: 1;
      background: linear-gradient(180deg, #1a2740, #10192c);
      border: 1px solid var(--line);
      color: var(--text);
      font-family: var(--font-pixel);
      font-size: 12px;
      font-weight: 700;
      border-radius: 0;
      clip-path: var(--cut-sm);
      padding: 9px 6px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.07), inset 0 -2px 0 rgba(0,0,0,.45);
    }
    #actions button:active { transform: translateY(1px); }
    #btn-base { border-color: var(--base); color: var(--base); }
    #btn-base.active { background: var(--base); color: #1a1a1a; }
    #btn-upgrade { border-color: var(--tech); color: var(--tech); }
    #btn-upgrade.working { background: #2b2145; }
    #btn-tech.open { background: #2b2145; border-color: var(--tech); color: var(--tech); }
    #btn-selectall { border-color: #4ade80; color: #4ade80; }
    #btn-selectall.active { background: #4ade80; color: #10231a; }
    #actions button:disabled { opacity: .4; cursor: default; }

    /* 유닛 팔레트 */
    #palette {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .unit {
      --unit-color: #64748b;
      position: relative;
      border: 2px solid var(--line);
      border-left: 5px solid var(--unit-color);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
      padding: 7px 6px;
      text-align: left;
      min-height: 52px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 90ms ease, border-color 90ms ease;
    }
    .unit .uname { font-size: 11.5px; font-weight: 700; letter-spacing: -.3px; line-height: 1.2; }
    .unit .ucost {
      align-self: flex-end;
      font-size: 11px; font-weight: 800;
      background: var(--mineral); color: #06232b;
      border-radius: 999px; min-width: 18px; height: 18px;
      display: grid; place-items: center;
    }
    .unit.selected { border-color: #facc15; transform: translateY(-4px); }
    .unit.unaffordable { opacity: .45; }
    .unit .air { color: #7dd3fc; font-size: 10px; }

    /* 테크 패널 */
    #tech-panel {
      margin-top: 8px;
      border: 1px solid var(--tech);
      border-radius: 10px;
      background: #17132b;
      padding: 8px;
      max-height: 190px;
      overflow-y: auto;
    }
    #tech-panel.hidden { display: none; }
    /* ── 통합 테크트리 — 연구와 생산이 한 판이다 ── */
    #palette { position: relative; display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
    /*
     * 닫으면 **카드판만** 사라진다. 기지 줄은 남는다 —
     * 갓 뽑은 병력이 기지 위에 서 있으면 지도에서 기지를 짚기가 어려워서,
     * 이 줄이 "지금 어디서 뭐가 나오나"이자 다시 여는 손잡이 노릇을 한다.
     */
    :root:not(.panel-open) #palette { display: none; }
    /* 208px에 세 버튼을 나란히 두면 "기지 건/설 (12)"로 잘린다 — 세로로 쌓는다 */
    :root:not(.panel-open) #actions { flex-direction: column; }

    /* ── 기지 줄 — 내 기지 전부의 큐를 한눈에, 고른 기지는 강조 ── */
    #basebar { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    #basebar-head {
      display: flex; align-items: baseline; justify-content: space-between;
      font-size: 11px; color: #cbd5e1; letter-spacing: .04em;
    }
    #basebar-head b { font: 700 11px/1.2 var(--font-pixel); color: var(--mineral); }
    .bchip {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px; border-radius: 6px; cursor: pointer;
      background: #0f172a; border: 1px solid #1e293b;
      font-size: 11px; color: var(--muted); text-align: left; width: 100%;
    }
    .bchip:hover { border-color: #334155; }
    .bchip.sel { border-color: var(--mineral); background: #0b2b33; color: #e2e8f0; }
    .bchip .bname { font-weight: 700; white-space: nowrap; }
    .bchip .bq { display: flex; gap: 3px; flex: 1; }
    .qslot {
      width: 16px; height: 16px; border-radius: 3px;
      background: #1e293b; border: 1px solid #334155;
      display: grid; place-items: center; font-size: 9px; color: #94a3b8;
    }
    .qslot.busy { background: var(--mineral); border-color: var(--mineral); color: #06232b; font-weight: 800; }
    .bchip .btime { font-variant-numeric: tabular-nums; white-space: nowrap; }
    #tree-links { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
    #tree-legend {
      flex-basis: 100%; font-size: 11px; color: var(--muted);
      line-height: 1.5; margin-top: 2px;
    }
    #tree-legend kbd {
      font-size: 9px; padding: 1px 4px; border: 1px solid #334155;
      border-radius: 3px; background: #0f172a;
    }
    /* 일꾼 카드 — 유닛과 같은 얼굴, 미네랄 색 테두리로 '경제의 수'임을 표시 */
    .tnode.worker-node { --unit-color: var(--mineral); }
    .tcol { display: flex; flex-direction: column; gap: 8px; flex: 1; z-index: 1; }
    .tcol-head {
      font: 700 11px/1.2 var(--font-pixel); color: #cbd5e1;
      letter-spacing: .08em; text-align: center; margin-bottom: 2px;
    }
    .tnode {
      --unit-color: #64748b;
      position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
      padding: 6px 4px 5px;
      transition: transform 90ms ease, border-color 90ms ease, opacity 120ms ease;
    }
    .tnode:hover { transform: translateY(-1px); border-color: var(--unit-color); }
    .tnode .nicon {
      width: 46px; height: 46px;
      border-radius: 8px;
      background-color: #0b1526;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      box-shadow: inset 0 0 0 1.5px var(--unit-color);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800; color: var(--unit-color);
    }
    .tnode .nname { font: 700 11px/1.2 var(--font-pixel); letter-spacing: 0; }
    .tnode .ncost {
      position: absolute; right: 4px; bottom: 4px;
      font-size: 10px; font-weight: 800;
      background: var(--mineral); color: #06232b;
      border-radius: 999px; padding: 1px 5px;
    }
    .tnode .ncost.loot {
      background: transparent; color: #c4b5fd;
      box-shadow: inset 0 0 0 1px #7c3aed; font-weight: 700;
    }
    .tnode .ukey { position: absolute; top: 3px; left: 5px; right: auto; }
    .tnode .nlock {
      position: absolute; top: 3px; right: 5px; font-size: 11px;
      filter: grayscale(1); opacity: .9;
    }
    .tnode .nprog {
      position: absolute; left: 4px; right: 4px; bottom: 0;
      height: 3px; border-radius: 2px; background: #0f172a; overflow: hidden;
      display: none;
    }
    .tnode .nprog i { display: block; height: 100%; width: 0; background: var(--deploy, #facc15); }
    .tnode.selected { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
    .tnode.unaffordable { opacity: .45; }
    .tnode.locked { opacity: .72; }
    /* 실루엣은 남긴다 — 무슨 유닛인지 안 보이면 "다음에 뭘 열지"를 계획할 수 없다 */
    .tnode.locked .nicon { filter: grayscale(.9) brightness(.85) contrast(.9); }
    .tnode.researchable { opacity: .95; border-style: dashed; border-color: #a78bfa; }
    .tnode.researchable .ncost { background: #a78bfa; color: #1e1533; }
    .tnode.researching { opacity: 1; border-color: #facc15; }
    .tnode.researching .nprog { display: block; }

    .tech-tier { font-size: 10px; color: var(--muted); margin: 4px 0 3px; }
    .tech-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .tech {
      --unit-color: #64748b;
      flex: 1 1 30%;
      border: 1px solid var(--line);
      border-left: 4px solid var(--unit-color);
      border-radius: 7px;
      background: var(--panel);
      color: var(--text);
      font-family: inherit;
      font-size: 11px;
      padding: 6px;
      cursor: pointer;
      text-align: left;
    }
    .tech .tname { font-weight: 700; display: block; }
    .tech .tmeta { color: var(--muted); font-size: 10px; }
    .tech.done { border-color: #22c55e; color: #86efac; cursor: default; }
    .tech.locked { opacity: .45; cursor: default; }
    .tech.researching { border-color: var(--tech); color: var(--tech); }

    #meta {
      display: flex; justify-content: space-between;
      margin-top: 6px; font-size: 11px; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    #netinfo.bad { color: #f87171; font-weight: 700; }

    /* 리플레이 재생 바 */
    #replay-bar { margin-top: 10px; }
    #replay-bar.hidden { display: none; }
    .rb-row { display: flex; align-items: center; gap: 10px; }
    .rb-row button {
      background: var(--panel); border: 1px solid var(--line); color: var(--text);
      font-family: inherit; font-size: 13px; font-weight: 700;
      border-radius: 8px; padding: 7px 12px; min-width: 46px; cursor: pointer;
    }
    #rb-seek { flex: 1; accent-color: var(--mineral); cursor: pointer; }
    .rb-info {
      display: flex; justify-content: space-between; margin-top: 6px;
      font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
    }
    body.replay #palette,
    body.replay #actions,
    body.replay #tech-panel,
    body.replay #mineral-row { display: none; }

    /* 시작 오버레이 */
    #overlay {
      position: fixed; inset: 0;
      /* 배경 일러스트 훅 — art/lobby.png가 도착하면 자동 반영, 없으면
         그라데이션만 남는다. 위 어둠막이 UI 가독성을 지킨다 */
      /* 중앙(UI 자리)만 어둡고 가장자리는 일러스트가 숨쉬게 */
      background:
        radial-gradient(
          ellipse 62% 55% at 50% 46%,
          rgba(6, 10, 20, 0.78) 0%,
          rgba(6, 10, 20, 0.5) 60%,
          rgba(6, 10, 20, 0.28) 100%
        ),
        url('/art/lobby.png') center / cover no-repeat,
        #0b1220;
      display: grid; place-content: center; justify-items: center;
      gap: 14px; padding: 24px; text-align: center; z-index: 10;
      overflow-y: auto;
    }
    #overlay.hidden { display: none; }
    #overlay-title {
      font-family: var(--font-pixel);
      letter-spacing: .45em;
      text-indent: .45em;
      text-shadow: 0 0 18px rgba(34, 211, 238, .55), 0 2px 0 #000; font-size: 28px; font-weight: 800; letter-spacing: -.5px; }
    #overlay p { color: var(--muted); font-size: 13px; max-width: 340px; line-height: 1.7; }
    #faction-picker { display: flex; flex-direction: column; gap: 8px; width: min(360px, 88vw); }
    #map-picker { display: flex; flex-direction: column; gap: 8px; width: min(360px, 88vw); }
    #draft {
      position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
      z-index: 40; padding: 12px 14px 14px;
      background: rgba(9, 16, 28, .94);
      clip-path: var(--cut);
      box-shadow: inset 0 0 0 1.5px #38bdf8, 0 0 24px rgba(56, 189, 248, .25);
    }
    #draft.hidden { display: none; }
    /* 드래프트 뒤 어둠막 — 없으면 뒤 카드 그리드 글자와 섞여 보인다 */
    #draft-dim {
      position: fixed; inset: 0; z-index: 39; background: rgba(3, 7, 16, .6);
      display: none; pointer-events: none; /* 시각 효과일 뿐 — 드래프트 중에도 시뮬은 돈다 */
    }
    body:has(#draft:not(.hidden)) #draft-dim { display: block; }
    #draft-title {
      font: 700 13px/1 var(--font-pixel); color: #7dd3fc;
      letter-spacing: 1px; text-align: center; margin-bottom: 10px;
    }
    #draft-cards { display: flex; gap: 10px; }
    /* 영웅 카드 — 런의 서명이라 유물·해금 카드보다 무겁게 보이게 한다 */
    .draft-card.hero { border-color: #a855f7; background: linear-gradient(180deg, #2e1065, #1e1b4b); }
    .draft-card.hero .dname { color: #e9d5ff; }
    .draft-card {
      width: 148px; padding: 10px; cursor: pointer; text-align: left;
      background: #101d30; border: 0; clip-path: var(--cut-sm);
      box-shadow: inset 0 2px 0 #1d334c, inset 0 -2px 0 #050b14;
    }
    .draft-card:hover { background: #17324e; box-shadow: inset 0 0 0 1.5px #38bdf8; }
    .draft-card .dname {
      display: block; font: 700 13px/1.2 var(--font-pixel); color: #eaf6ff;
      margin-bottom: 6px;
    }
    .draft-card .ddesc { display: block; font-size: 11px; line-height: 1.45; color: #8fa8bd; }
    .draft-card.unlock .dname { color: #fbbf24; }
    #mode-picker { display: flex; gap: 8px; width: min(360px, 88vw); }
    #mode-picker.hidden, #lobby-label-mode.hidden { display: none; }
    #mode-picker .mode.selected {
      color: #0a1626; background: #7dd3fc;
      box-shadow: inset 0 0 0 1.5px #bae6fd, 0 0 12px rgba(125, 211, 252, .4);
    }
    #level-picker { display: flex; gap: 8px; width: min(360px, 88vw); }
    #level-picker.hidden { display: none; }
    #lobby-label-level.hidden { display: none; }
    .lvl {
      flex: 1; padding: 9px 0;
      font: 700 13px/1 var(--font-pixel);
      color: #7e93a8; letter-spacing: 1px;
      background: #101d30; border: 0; cursor: pointer;
      clip-path: var(--cut-sm);
      box-shadow: inset 0 2px 0 #1d334c, inset 0 -2px 0 #050b14;
    }
    .lvl:hover { color: #cfe3f5; }
    .lvl.selected {
      color: #eaf6ff; background: #17324e;
      box-shadow: inset 0 0 0 1.5px #38bdf8, 0 0 10px rgba(56, 189, 248, .25);
    }
    #lobby-label, .lobby-label {
      font-family: var(--font-pixel);
      font-size: 11px; font-weight: 700; color: var(--muted);
      letter-spacing: .4em; text-indent: .4em; margin-top: 10px;
    }
    #lobby-label::before, .lobby-label::before { content: '— '; color: #2b4a63; }
    #lobby-label::after, .lobby-label::after { content: ' —'; color: #2b4a63; }
    #entry, #setup { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    #entry.hidden, #setup.hidden { display: none; }
    #btn-solo-start {
      width: min(360px, 88vw); padding: 12px; border: none; border-radius: 0;
      clip-path: var(--cut-sm);
      font-family: var(--font-pixel); font-weight: 700; font-size: 14px;
      color: #fff; cursor: pointer;
      background: linear-gradient(180deg, #38bdf8, #4453e6);
      box-shadow: inset 0 2px 0 rgba(255,255,255,.25), inset 0 -3px 0 rgba(0,0,0,.35);
    }
    #btn-solo-start:active { transform: translateY(1px); }
    #btn-solo-start.hidden { display: none; }
    #room-map.hidden { display: none; }
    .faction.mappick {
      border-left-color: var(--mineral);
      display: flex; align-items: center; gap: 12px; text-align: left;
    }
    .mthumb {
      flex: 0 0 64px; width: 64px; height: 64px;
      background-size: cover; background-position: center;
      clip-path: var(--cut-sm);
      box-shadow: inset 0 0 0 1px rgba(34,211,238,.35);
      image-rendering: pixelated;
    }
    .faction.mappick.selected .mthumb { box-shadow: inset 0 0 0 2px var(--mineral); }
    .mtext { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .fface {
      position: absolute; right: 10px; top: 50%; width: 64px; height: 64px;
      transform: translateY(-50%);
      background-repeat: no-repeat;
      image-rendering: pixelated;
      filter: drop-shadow(0 0 8px color-mix(in srgb, var(--f-color, #38bdf8) 55%, transparent));
      opacity: .5; pointer-events: none;
    }
    .faction.selected .fface { opacity: 1; }
    #pvp-row { display: flex; gap: 8px; width: min(360px, 88vw); margin-top: 8px; }
    #pvp-row button {
      flex: 1; padding: 11px 8px; font-weight: 700;
      font-family: var(--font-pixel);
      border: 0; border-radius: 0; clip-path: var(--cut-sm);
      background: linear-gradient(180deg, #1a2740, #10192c);
      color: var(--text); cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -2px 0 rgba(0,0,0,.5);
    }
    #pvp-row button:active { transform: translateY(1px); }
    #btn-create { color: var(--mineral); box-shadow: inset 0 0 0 1px rgba(34,211,238,.4), inset 0 -2px 0 rgba(0,0,0,.5); }
    #join-code {
      width: 84px; text-align: center; text-transform: uppercase;
      font-family: var(--font-pixel); font-weight: 700; letter-spacing: .2em;
      background: #0f172a; border: 1px solid var(--line); border-radius: 0;
      clip-path: var(--cut-sm); color: var(--mineral);
    }
    #room-panel {
      width: min(360px, 88vw); margin-top: 12px; padding: 16px 14px;
      border: 0; border-radius: 0; clip-path: var(--cut);
      background:
        linear-gradient(180deg, rgba(34,211,238,.09), rgba(19,28,46,.96) 30%),
        var(--panel);
      box-shadow: inset 0 0 0 1px rgba(34,211,238,.45), inset 0 0 26px rgba(34,211,238,.07);
      display: flex; flex-direction: column; gap: 10px; align-items: center;
    }
    #room-panel.hidden { display: none; }
    #room-code-label { font-size: 11px; color: var(--muted); }
    #room-code {
      font-family: var(--font-pixel); font-size: 34px; font-weight: 700;
      letter-spacing: .35em; text-indent: .35em; color: var(--mineral);
      text-shadow: 0 0 14px rgba(34, 211, 238, .6);
    }
    #room-code::before { content: '[ '; color: #2b4a63; }
    #room-code::after { content: ' ]'; color: #2b4a63; }
    #room-map { font-size: 12px; color: var(--muted); }
    #room-players { display: flex; flex-direction: column; gap: 6px; width: 100%; font-size: 13px; }
    .room-p {
      display: flex; justify-content: space-between; padding: 8px 10px;
      background: #0f172a; border-radius: 0; clip-path: var(--cut-sm);
      font-family: var(--font-pixel); font-size: 12px;
      box-shadow: inset 0 0 0 1px #1c2a44;
    }
    .room-p .rp-state { color: var(--muted); }
    .room-p.ready .rp-state { color: #4ade80; font-weight: 700; }
    #btn-ready, #btn-start-room {
      width: 100%; padding: 12px; border: none; border-radius: 0;
      clip-path: var(--cut-sm);
      font-family: var(--font-pixel); font-weight: 700; font-size: 14px;
      color: #fff; cursor: pointer;
      background: linear-gradient(180deg, #38bdf8, #4453e6);
      box-shadow: inset 0 2px 0 rgba(255,255,255,.25), inset 0 -3px 0 rgba(0,0,0,.35);
    }
    #btn-ready:active, #btn-start-room:active { transform: translateY(1px); }
    #btn-ready.on { background: linear-gradient(180deg, #34d399, #0a7f5c); }
    #btn-start-room:disabled { opacity: .4; cursor: default; }
    #btn-ready.hidden, #btn-start-room.hidden { display: none; }
    .faction {
      font-family: var(--font-pixel);
      clip-path: var(--cut);
      border-radius: 0 !important;
      position: relative;
      background:
        linear-gradient(100deg,
          color-mix(in srgb, var(--f-color, #38bdf8) 16%, transparent) 0%,
          transparent 45%),
        var(--panel);
      --f-color: #64748b;
      background: var(--panel);
      border: 2px solid var(--line);
      border-left: 5px solid var(--f-color);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text); font-family: inherit;
      cursor: pointer; text-align: left;
      transition: border-color 90ms ease, transform 90ms ease;
    }
    .faction:hover { transform: translateX(3px); }
    .faction:not(.selected) { opacity: .5; }
    .faction.selected {
      box-shadow: inset 0 0 22px color-mix(in srgb, var(--f-color, #38bdf8) 28%, transparent);
      opacity: 1; border-color: var(--f-color); background: #1b2740;
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--f-color) 35%, transparent);
    }
    .faction .fname { font-size: 14px; font-weight: 800; display: block; }
    .faction .ftag { font-size: 11px; color: var(--muted); line-height: 1.4; display: block; margin-top: 3px; }
    #faction-detail {
      width: min(360px, 88vw);
      display: flex; flex-wrap: wrap; gap: 4px; justify-content: center;
      min-height: 40px;
    }
    .chip {
      font-size: 10.5px; padding: 3px 7px; border-radius: 999px;
      background: #1b2740; border: 1px solid var(--line);
      border-left: 3px solid var(--chip-color, #64748b); white-space: nowrap;
    }
    .chip.start { border-color: #22c55e; }
    .chip .cc { color: var(--mineral); font-weight: 800; margin-left: 3px; }
    #name {
      font-family: var(--font-pixel);
      border-radius: 0 !important; clip-path: var(--cut-sm);
      background: var(--panel); border: 1px solid var(--line); color: var(--text);
      border-radius: 8px; padding: 10px 12px; font-family: inherit;
      font-size: 14px; text-align: center;
    }
    #start {
      background: linear-gradient(180deg, #38bdf8, #4453e6);
      color: #fff; border: 0; border-radius: 0;
      clip-path: var(--cut-sm);
      padding: 12px 34px; font-size: 15px; font-weight: 700;
      font-family: var(--font-pixel); cursor: pointer;
      box-shadow: inset 0 2px 0 rgba(255,255,255,.25), inset 0 -3px 0 rgba(0,0,0,.35);
    }
    #start:active { transform: translateY(1px); }
    #start:disabled { opacity: .5; cursor: default; }
    #status { color: var(--muted); font-size: 13px; min-height: 18px; white-space: pre-line; }

    #tooltip {
      position: fixed;
      z-index: 40;
      pointer-events: none;
      background: #0f172aee;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.55;
      max-width: 240px;
      box-shadow: 0 6px 20px #0008;
    }
    #tooltip.hidden { display: none; }
    #tooltip .tt-name { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
    #tooltip .tt-cost { color: #67e8f9; }
    #tooltip .tt-row { color: #cbd5e1; }
    #tooltip .tt-warn { color: #fbbf24; }

    #toast {
      /* 가로 가운데 정렬 — 없으면 화면 **왼쪽 끝**에 붙어서, 본진을 보고
         있는 플레이어의 시야 밖에 뜬다 (라운드 42에 스크린샷으로 확인) */
      position: fixed; bottom: 240px; left: 50%; transform: translateX(-50%);
      max-width: min(560px, 86vw); text-align: center;
      background: rgba(15,23,42,.95); border: 1px solid var(--line);
      padding: 8px 16px; border-radius: 999px; font-size: 13px;
      opacity: 0; transition: opacity 150ms ease; pointer-events: none; z-index: 20;
    }
    #toast.show { opacity: 1; }
    /* 거절은 눈에 띄어야 한다 — 파도 한복판에서 1.4초 회색 토스트는
       그냥 안 보인다. 붉게, 크게, 조금 더 오래 (라운드 42) */
    #toast.warn {
      background: rgba(80, 12, 20, .96); border-color: #f87171; color: #fee2e2;
      font-weight: 700; font-size: 14px; padding: 10px 20px;
      box-shadow: 0 0 22px rgba(248, 113, 113, .35);
    }
  </style>
</head>
<body>
  <div id="topbar">
    <span id="score">🏠 1 : 1</span>
    <span id="opponent"></span>
    <span id="timer">4:00</span>
    <button id="btn-mute" type="button" title="소리 끄기 (M)">🔊</button>
  </div>

  <div id="arena"></div>

  <div id="bottom">
    <div id="mineral-row">
      <div id="mineral-bar">
        <div id="mineral-fill"></div>
        <div id="mineral-num">8</div>
      </div>
      <span id="workers">⛏ 2/8</span>
      <span id="income">+0.0/s</span>
    </div>

    <div id="actions">
      <button id="btn-base" type="button">기지 건설 (12)</button>
      <button id="btn-upgrade" type="button">⚔ 강화</button>
      <button id="btn-selectall" type="button">▣ 전군</button>
    </div>

    <div id="basebar"></div>
    <div id="palette"></div>

    <div id="meta">
      <span id="research"></span>
      <span id="netinfo"></span>
    </div>

    <div id="replay-bar" class="hidden">
      <div class="rb-row">
        <button id="rb-play">▶</button>
        <input id="rb-seek" type="range" min="0" max="1000" value="0" step="1" />
        <button id="rb-speed">1×</button>
      </div>
      <div class="rb-info">
        <span id="rb-title"></span>
        <span id="rb-time"></span>
      </div>
    </div>
  </div>

  <div id="tooltip" class="hidden"></div>

  <div id="overlay">
    <div id="overlay-title">로얄</div>
    <p id="intro">
      기지가 미네랄을 캐고, 미네랄로 <strong>병력·확장·테크</strong>를 고릅니다.<br />
      유닛은 <strong>내 기지 반경 안</strong>에만 배치할 수 있으니,
      앞으로 나아가려면 먼저 확장하세요.
    </p>
    <!-- 1단: 대기실 — 이름을 정하고 어디로 갈지 고른다 -->
    <div id="entry">
      <input id="name" maxlength="20" placeholder="닉네임" value="플레이어" />
      <button id="start">봇과 연습</button>
      <div id="pvp-row">
        <button id="btn-create">방 만들기</button>
        <input id="join-code" maxlength="4" placeholder="코드" />
        <button id="btn-join">참가</button>
      </div>
    </div>

    <!-- 2단: 설정 — 방(또는 솔로)에 들어와서 종족·맵을 고르고 시작한다 -->
    <div id="setup" class="hidden">
      <div id="room-panel" class="hidden">
        <div id="room-code-label">방 코드 — 상대에게 알려주세요</div>
        <div id="room-code"></div>
        <div id="room-players"></div>
      </div>
      <div id="lobby-label-mode" class="lobby-label">모드</div>
      <div id="mode-picker">
        <button class="lvl mode selected" data-mode="versus">대전</button>
        <button class="lvl mode" data-mode="sandbox">실험장</button>
        <button class="lvl mode" data-mode="invasion">침공</button>
      </div>
      <div id="lobby-label">종족</div>
      <div id="faction-picker"></div>
      <div id="faction-detail"></div>
      <div id="lobby-label-map" class="lobby-label">맵</div>
      <div id="map-picker"></div>
      <div id="room-map" class="hidden"></div>
      <div id="lobby-label-level" class="lobby-label hidden">봇 난이도</div>
      <div id="level-picker" class="hidden">
        <button class="lvl" data-level="easy">초급</button>
        <button class="lvl selected" data-level="normal">중급</button>
        <button class="lvl" data-level="hard">고급</button>
      </div>
      <button id="btn-solo-start" class="hidden">시작</button>
      <button id="btn-ready" class="hidden">준비</button>
      <button id="btn-start-room" class="hidden" disabled>경기 시작</button>
    </div>
    <div id="over-actions" class="hidden"></div>
    <div id="status"></div>
  </div>

  <div id="draft-dim"></div>
  <div id="draft" class="hidden">
    <div id="draft-title">파도 소탕 — 전리품을 골라라</div>
    <div id="draft-cards"></div>
  </div>

  <div id="hint"></div>

  <div id="toast"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
