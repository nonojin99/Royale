name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 타입 검사
        run: pnpm -r typecheck

      - name: 결정론 테스트
        run: pnpm --filter @royale/shared test

      # 서버·클라이언트가 같은 시뮬을 유지하는지 실제 프로세스로 검증한다.
      # 여기가 깨지면 두 플레이어가 서로 다른 게임을 보게 된다.
      - name: 넷코드 E2E
        run: pnpm --filter @royale/server test:e2e

      # 경기를 3분 끝까지 돌려 리플레이가 저장되고 그대로 재현되는지 확인한다.
      # 느리지만, 리플레이가 실제 경기와 어긋나면 밸런싱 분석 전체가 무의미해진다.
      - name: 리플레이 E2E
        run: pnpm --filter @royale/server test:replay
        timeout-minutes: 8

      - name: 클라이언트 빌드
        run: pnpm --filter @royale/client build
